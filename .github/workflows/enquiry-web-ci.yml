# Continuous integration for the React enquiry form.
name: Enquiry web CI

on:
  pull_request:
    paths:
      - 'enquiry-flow/web/**'
      - '.github/workflows/enquiry-web-ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'enquiry-flow/web/**'
      - '.github/workflows/enquiry-web-ci.yml'

concurrency:
  group: enquiry-web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: enquiry-flow/web

jobs:
  test:
    name: Type-check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: enquiry-flow/web/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Unit and component tests
        run: npm test
